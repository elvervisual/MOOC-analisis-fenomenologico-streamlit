<rect x="598" y="792" width="362" height="44" rx="10" fill="#E6F2E6" stroke="#2E7D32" stroke-width="2"/>
<text x="779.0" y="818.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">ASP-09 · Reencuentro con el amigo-familia</text>
<text x="40" y="864" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#56626B" text-anchor="start" font-style="italic">En la entrevista completa: 18 unidades → 11 aspectos vividos (aquí se muestran seis).</text>
<polyline points="960,916 100,916" fill="none" stroke="#8A3B5C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m8A3B5C)"/>
