<text x="100" y="764" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#56626B" text-anchor="middle">L. 65–67</text>
<rect x="176" y="736" width="330" height="44" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="341.0" y="762.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Media hora; antes, horas</text>
