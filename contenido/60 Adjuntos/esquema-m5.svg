<text x="779.0" y="650.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">ASP-05 · Romper las reglas juntos</text>
<rect x="40" y="680" width="120" height="44" rx="8" fill="#FAFBFA" stroke="#C9D1CD" stroke-width="1.5"/>
<text x="100" y="708" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#56626B" text-anchor="middle">L. 61–62</text>
<rect x="176" y="680" width="330" height="44" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="341.0" y="706.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Liberar lo negativo</text>
