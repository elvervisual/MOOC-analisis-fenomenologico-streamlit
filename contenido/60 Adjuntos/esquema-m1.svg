<rect x="0" y="0" width="1000" height="1010" rx="14" fill="#FFFFFF"/>
<text x="500.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1C2329" text-anchor="middle">Sección 1 · Qué busca el análisis fenomenológico</text>
<text x="500.0" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#56626B" text-anchor="middle">La pregunta decide el enfoque; Van Manen organiza el trabajo en seis actividades que se alternan</text>
<text x="40" y="118" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">1. La pregunta decide qué se analiza</text>
<line x1="40" y1="128" x2="960" y2="128" stroke="#C9D1CD" stroke-width="1.5"/>
<rect x="60" y="142" width="240" height="40" rx="20.0" fill="#F2F4F3" stroke="#56626B" stroke-width="1.6"/>
<text x="180.0" y="167.76" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#56626B" text-anchor="middle">«¿Por qué ocurre?»</text>
<polyline points="180,184 180,214" fill="none" stroke="#56626B" stroke-width="2" marker-end="url(#m56626B)"/>
<rect x="40" y="216" width="280" height="56" rx="10" fill="#F2F4F3" stroke="#56626B" stroke-width="2"/>
<text x="180.0" y="249.1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#56626B" text-anchor="middle">Teoría fundamentada</text>
<polyline points="180,274 180,304" fill="none" stroke="#56626B" stroke-width="2" marker-end="url(#m56626B)"/>
<text x="190" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#56626B" text-anchor="start" font-style="italic">produce</text>
<rect x="40" y="306" width="280" height="64" rx="10" fill="#F2F4F3" stroke="#56626B" stroke-width="2"/>
<text x="180.0" y="342.8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">Una teoría que explica</text>
<rect x="380" y="142" width="240" height="40" rx="20.0" fill="#F2F4F3" stroke="#56626B" stroke-width="1.6"/>
<text x="500.0" y="167.76" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#56626B" text-anchor="middle">«¿Cuántas veces?»</text>
<polyline points="500,184 500,214" fill="none" stroke="#56626B" stroke-width="2" marker-end="url(#m56626B)"/>
<rect x="360" y="216" width="280" height="56" rx="10" fill="#F2F4F3" stroke="#56626B" stroke-width="2"/>
<text x="500.0" y="249.1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#56626B" text-anchor="middle">Codificación para contar</text>
<polyline points="500,274 500,304" fill="none" stroke="#56626B" stroke-width="2" marker-end="url(#m56626B)"/>
<text x="510" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#56626B" text-anchor="start" font-style="italic">produce</text>
<rect x="360" y="306" width="280" height="64" rx="10" fill="#F2F4F3" stroke="#56626B" stroke-width="2"/>
<text x="500.0" y="342.8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">Frecuencias de categorías</text>
<rect x="700" y="142" width="240" height="40" rx="20.0" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="1.6"/>
<text x="820.0" y="167.76" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4C8A" text-anchor="middle">«¿Cómo es vivir esto?»</text>
<polyline points="820,184 820,214" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<rect x="680" y="216" width="280" height="56" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="820.0" y="249.1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6B4C8A" text-anchor="middle">Fenomenología hermenéutica</text>
<polyline points="820,274 820,304" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<text x="830" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B4C8A" text-anchor="start" font-style="italic">produce</text>
<rect x="680" y="306" width="280" height="64" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="820.0" y="332.3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">Estructuras de significado</text>
<text x="820.0" y="353.3" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">de la experiencia vivida</text>
<text x="500" y="398" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">Un tema no vale por cuántas veces aparece, sino por el significado que muestra.</text>
<text x="40" y="446" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">2. Se vuelve sobre una experiencia ya vivida</text>
<line x1="40" y1="456" x2="960" y2="456" stroke="#C9D1CD" stroke-width="1.5"/>
<rect x="40" y="476" width="250" height="92" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="165.0" y="507.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F7A78" text-anchor="middle">Vivir</text>
<text x="165.0" y="531.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">la experiencia, antes de</text>
<text x="165.0" y="551.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">conceptualizarla (prerreflexiva)</text>
<polyline points="292,522 373,522" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<text x="332" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1F7A78" text-anchor="middle" font-style="italic">después</text>
<rect x="375" y="476" width="250" height="92" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="500.0" y="507.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Reflexionar</text>
<text x="500.0" y="531.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">volver sobre lo vivido</text>
<text x="500.0" y="551.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">(retrospectiva)</text>
<polyline points="627,522 708,522" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/>
<text x="667" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#2E7D32" text-anchor="middle" font-style="italic">escribiendo</text>
<rect x="710" y="476" width="250" height="92" rx="10" fill="#E6F2E6" stroke="#2E7D32" stroke-width="2"/>
<text x="835.0" y="507.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32" text-anchor="middle">Comprender</text>
<text x="835.0" y="531.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">el significado de esa</text>
<text x="835.0" y="551.4000000000001" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">experiencia para esta persona</text>
<text x="500" y="598" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">No es introspección: no se observa un estado interior en el momento. Busca «lo único» de esta situación.</text>
<text x="40" y="646" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">3. Seis actividades que se alternan, no etapas fijas (Van Manen, 2003, p. 48)</text>
