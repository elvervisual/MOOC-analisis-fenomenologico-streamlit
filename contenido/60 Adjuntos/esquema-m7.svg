<circle cx="910.0" cy="714" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
<rect x="40" y="750" width="920" height="52" rx="8" fill="#FFFFFF" stroke="#C9D1CD" stroke-width="1.2"/>
<text x="56" y="782" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="start">T2 · Salir a escondidas para poder respirar</text>
<circle cx="610.0" cy="776" r="13" fill="#1F7A78"/>
<circle cx="710.0" cy="776" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
<circle cx="810.0" cy="776" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
<circle cx="910.0" cy="776" r="13" fill="#6B4C8A"/>
<rect x="40" y="812" width="920" height="52" rx="8" fill="#FAFBFA" stroke="#C9D1CD" stroke-width="1.2"/>
<text x="56" y="844" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="start">T3 · Los amigos como alivio y como familia</text>
<circle cx="610.0" cy="838" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
<circle cx="710.0" cy="838" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
<circle cx="810.0" cy="838" r="13" fill="#B7791F"/>
<circle cx="910.0" cy="838" r="13" fill="#6B4C8A"/>
<rect x="40" y="890" width="920" height="70" rx="10" fill="#F7E6E1" stroke="#A84A32" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500.0" y="919.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">El cuerpo vivido no domina en ningún tema porque el material casi no lo nombra:</text>
<text x="500.0" y="939.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">se convierte en pregunta para la segunda conversación (Sección 8). Los existenciales son lentes, no casillas.</text>
</svg>