<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Sección 7 · Los cuatro existenciales">
<title>Sección 7 · Los cuatro existenciales</title>
<defs><marker id="m1F7A78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A78"/></marker><marker id="m6B4C8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4C8A"/></marker><marker id="mA84A32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A84A32"/></marker><marker id="mB7791F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker></defs>
<rect x="0" y="0" width="1000" height="1000" rx="14" fill="#FFFFFF"/>
<text x="500.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1C2329" text-anchor="middle">Sección 7 · Los cuatro existenciales</text>
<text x="500.0" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#56626B" text-anchor="middle">Cuatro lentes para releer cada tema (Van Manen, 2003, pp. 119–124): se marcan solo cuando revelan algo</text>
<text x="40" y="118" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">1. Cuatro preguntas al mismo tema · evidencia en la entrevista a Tomás</text>
<line x1="40" y1="128" x2="960" y2="128" stroke="#C9D1CD" stroke-width="1.5"/>
<rect x="400" y="340" width="200" height="90" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="500.0" y="372.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Tema</text>
<text x="500.0" y="396.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">p. ej., T3 · Los amigos</text>
<text x="500.0" y="414.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">como alivio y como familia</text>
<rect x="300" y="150" width="400" height="108" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="500.0" y="182.1" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F7A78" text-anchor="middle">Espacio vivido</text>
<text x="500.0" y="205.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">¿Cómo se siente el lugar?</text>
<text x="500.0" y="223.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">casa / «por fuera de mi casa» (L. 28)</text>
<text x="500.0" y="241.1" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">zona rural, escuela del pueblo</text>
<polyline points="500,260 500,338" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<rect x="640" y="290" width="320" height="112" rx="10" fill="#FBF1E1" stroke="#B7791F" stroke-width="2"/>
<text x="800.0" y="324.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#B7791F" text-anchor="middle">Tiempo vivido</text>
<text x="800.0" y="347.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">¿Cómo se vive el tiempo?</text>
<text x="800.0" y="365.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">marzo de 2020 (L. 30–31)</text>
<text x="800.0" y="383.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">media hora frente a horas (L. 65–67)</text>
<polyline points="638,375 602,375" fill="none" stroke="#B7791F" stroke-width="2" marker-end="url(#mB7791F)"/>
<rect x="300" y="462" width="400" height="108" rx="10" fill="#F7E6E1" stroke="#A84A32" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500.0" y="494.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#A84A32" text-anchor="middle">Cuerpo vivido</text>
<text x="500.0" y="517.0999999999999" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">¿Qué se siente en el cuerpo?</text>
<text x="500.0" y="535.0999999999999" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">casi sin evidencia: baloncesto, fumar</text>
<text x="500.0" y="553.0999999999999" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">→ se pregunta, no se inventa</text>
<polyline points="500,460 500,432" fill="none" stroke="#A84A32" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mA84A32)"/>
<rect x="40" y="290" width="320" height="112" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="200.0" y="324.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6B4C8A" text-anchor="middle">Relación vivida</text>
<text x="200.0" y="347.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">¿Cómo se vive el vínculo?</text>
<text x="200.0" y="365.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">el amigo «como mi familia» (L. 82–83)</text>
<text x="200.0" y="383.09999999999997" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">la policía como norma (L. 43)</text>
<polyline points="362,375 398,375" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<text x="40" y="630" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">2. Existencial dominante en cada tema</text>
<line x1="40" y1="640" x2="960" y2="640" stroke="#C9D1CD" stroke-width="1.5"/>
<text x="610.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F7A78" text-anchor="middle">Espacio</text>
<text x="710.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#A84A32" text-anchor="middle">Cuerpo</text>
<text x="810.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#B7791F" text-anchor="middle">Tiempo</text>
<text x="910.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6B4C8A" text-anchor="middle">Relación</text>
