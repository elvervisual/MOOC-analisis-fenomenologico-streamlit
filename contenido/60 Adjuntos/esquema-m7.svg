<text x="56" y="720" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="start">T1 · El encierro como corte de una vida hecha afuera</text>
<circle cx="610.0" cy="714" r="13" fill="#1F7A78"/>
<circle cx="710.0" cy="714" r="11" fill="none" stroke="#C9D1CD" stroke-width="2"/>
