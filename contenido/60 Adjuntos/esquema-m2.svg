<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Sección 2 · Pregunta fenomenológica y presuposiciones">
<title>Sección 2 · Pregunta fenomenológica y presuposiciones</title>
<defs><marker id="m1F7A78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A78"/></marker><marker id="m6B4C8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4C8A"/></marker></defs>
<rect x="0" y="0" width="1000" height="1000" rx="14" fill="#FFFFFF"/>
<text x="500.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1C2329" text-anchor="middle">Sección 2 · Pregunta fenomenológica y presuposiciones</text>
<text x="500.0" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#56626B" text-anchor="middle">Se formula una pregunta que nombra la vivencia y se escriben las creencias propias antes de leer</text>
<text x="40" y="118" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">1. De una pregunta causal a una pregunta fenomenológica</text>
<line x1="40" y1="128" x2="960" y2="128" stroke="#C9D1CD" stroke-width="1.5"/>
<rect x="40" y="144" width="400" height="96" rx="10" fill="#F7E6E1" stroke="#A84A32" stroke-width="2"/>
<text x="240.0" y="176.4" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#A84A32" text-anchor="middle">✗ Pide una causa</text>
<text x="240.0" y="200.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">«¿Por qué los estudiantes de primer</text>
<text x="240.0" y="221.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">semestre abandonan el posgrado?»</text>
<polyline points="442,192 556,192" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<text x="499" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#6B4C8A" text-anchor="middle" font-style="italic">reformular</text>
<rect x="560" y="144" width="400" height="96" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="760.0" y="176.4" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6B4C8A" text-anchor="middle">✓ Nombra la vivencia</text>
<text x="760.0" y="200.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">«¿Cómo es vivir el primer</text>
<text x="760.0" y="221.4" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">semestre de un posgrado?»</text>
<rect x="40" y="262" width="222" height="36" rx="18.0" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="1.6"/>
<text x="151.0" y="284.68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B4C8A" text-anchor="middle">✓ El participante la reconoce</text>
<rect x="274" y="262" width="196" height="36" rx="18.0" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="1.6"/>
<text x="372.0" y="284.68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B4C8A" text-anchor="middle">✓ No pide explicaciones</text>
<rect x="482" y="262" width="118" height="36" rx="18.0" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="1.6"/>
<text x="541.0" y="284.68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B4C8A" text-anchor="middle">✓ No evalúa</text>
<rect x="612" y="262" width="140" height="36" rx="18.0" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="1.6"/>
<text x="682.0" y="284.68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B4C8A" text-anchor="middle">✓ No generaliza</text>
<rect x="764" y="262" width="196" height="36" rx="18.0" fill="#F2F4F3" stroke="#56626B" stroke-width="1.6"/>
<text x="862.0" y="284.68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#56626B" text-anchor="middle">+ escribe lo que deja fuera</text>
<text x="40" y="350" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">2. Époché: las presuposiciones se hacen visibles, no se borran</text>
<line x1="40" y1="360" x2="960" y2="360" stroke="#C9D1CD" stroke-width="1.5"/>
<rect x="40" y="378" width="212" height="92" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="146.0" y="418.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Escribir lo que ya</text>
<text x="146.0" y="438.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">creo, antes de leer</text>
<circle cx="60" cy="398" r="14" fill="#6B4C8A"/>
<text x="60" y="403" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<polyline points="253,424 276,424" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<rect x="277" y="378" width="212" height="92" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="383.0" y="418.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Ligar cada creencia</text>
<text x="383.0" y="438.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">al pasaje que sesga</text>
<circle cx="297" cy="398" r="14" fill="#6B4C8A"/>
<text x="297" y="403" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<polyline points="490,424 513,424" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<rect x="514" y="378" width="212" height="92" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="620.0" y="418.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">¿Es mía, social</text>
<text x="620.0" y="438.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">o del texto?</text>
<circle cx="534" cy="398" r="14" fill="#6B4C8A"/>
<text x="534" y="403" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<polyline points="727,424 750,424" fill="none" stroke="#6B4C8A" stroke-width="2" marker-end="url(#m6B4C8A)"/>
<rect x="751" y="378" width="212" height="92" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="857.0" y="418.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Releer: ¿qué dice el</text>
<text x="857.0" y="438.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">texto y qué agrego yo?</text>
<circle cx="771" cy="398" r="14" fill="#6B4C8A"/>
<text x="771" y="403" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="500" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">Si descubres una presuposición a mitad del análisis: añádela al memo y relee ese pasaje.</text>
<text x="40" y="548" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1C2329" text-anchor="start">3. Ejemplo con la entrevista a Tomás: el texto corrige cada presuposición</text>
<line x1="40" y1="558" x2="960" y2="558" stroke="#C9D1CD" stroke-width="1.5"/>
<text x="230" y="584" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4C8A" text-anchor="middle">Lo que yo creía</text>
<text x="770" y="584" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F7A78" text-anchor="middle">Lo que dice Tomás</text>
<rect x="40" y="600" width="380" height="78" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="230.0" y="633.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">El encierro se recuerda</text>
<text x="230.0" y="654.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">solo como sufrimiento</text>
<polyline points="422,639 578,639" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<text x="500" y="630" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1F7A78" text-anchor="middle" font-style="italic">corrige · L. 52–61</text>
<rect x="580" y="600" width="380" height="78" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="770.0" y="633.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">«con mis amigos</text>
<text x="770.0" y="654.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">exactamente no»</text>
<rect x="40" y="696" width="380" height="78" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="230.0" y="729.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">Romper las reglas es</text>
<text x="230.0" y="750.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">irresponsabilidad</text>
<polyline points="422,735 578,735" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<text x="500" y="726" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1F7A78" text-anchor="middle" font-style="italic">corrige · L. 43–51</text>
<rect x="580" y="696" width="380" height="78" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="770.0" y="729.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">No lo juzga: lo cuenta</text>
<text x="770.0" y="750.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">en plural, como liberación</text>
<rect x="40" y="792" width="380" height="78" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="230.0" y="825.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">La familia es el vínculo</text>
<text x="230.0" y="846.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">central en el encierro</text>
<polyline points="422,831 578,831" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<text x="500" y="822" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1F7A78" text-anchor="middle" font-style="italic">corrige · L. 81–83</text>
<rect x="580" y="792" width="380" height="78" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="770.0" y="825.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">El amigo es</text>
<text x="770.0" y="846.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">«como mi familia»</text>
<rect x="40" y="888" width="380" height="78" rx="10" fill="#EFE8F6" stroke="#6B4C8A" stroke-width="2"/>
<text x="230.0" y="921.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">El encierro se vive sobre</text>
<text x="230.0" y="942.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">todo dentro de la casa</text>
<polyline points="422,927 578,927" fill="none" stroke="#1F7A78" stroke-width="2" marker-end="url(#m1F7A78)"/>
<text x="500" y="918" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1F7A78" text-anchor="middle" font-style="italic">corrige · L. 27–40</text>
<rect x="580" y="888" width="380" height="78" rx="10" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
<text x="770.0" y="921.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">Lo que pesa es</text>
<text x="770.0" y="942.3000000000001" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#1C2329" text-anchor="middle">perder el afuera</text>
</svg>