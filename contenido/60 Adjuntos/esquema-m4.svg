<text x="360.00000000000006" y="432.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">muy brusco» (L. 32–33)</text>
<rect x="592.6666666666666" y="324" width="68" height="5" rx="2" fill="#E0B400"/>
<polyline points="626.6666666666666,336 626.6666666666666,386" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/>
