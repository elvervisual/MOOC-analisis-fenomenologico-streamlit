<text x="893.3333333333334" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">L. 95–100</text>
<text x="560.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">incidentes: momentos del relato con principio y cierre (no a escala)</text>
<text x="40" y="404" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32" text-anchor="start">2 · Selectiva</text>
<text x="40" y="426" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">¿Qué frases</text>
<text x="40" y="443" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">revelan la</text>
<text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">experiencia?</text>
<rect x="326.00000000000006" y="324" width="68" height="5" rx="2" fill="#E0B400"/>
<polyline points="360.00000000000006,336 360.00000000000006,386" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/>
