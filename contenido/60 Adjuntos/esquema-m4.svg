<title>Sección 4 · Lectura holística y lectura selectiva</title>
<defs><marker id="m2E7D32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="0" y="0" width="1000" height="900" rx="14" fill="#FFFFFF"/>
<text x="500.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1C2329" text-anchor="middle">Sección 4 · Lectura holística y lectura selectiva</text>
<text x="500.0" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#56626B" text-anchor="middle">Tres maneras de leer el mismo texto, de lo general a lo particular (Van Manen, 2003, pp. 110–113)</text>
<text x="40" y="120" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F" text-anchor="start">1 · Holística</text>
<text x="40" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">¿Qué frase dice</text>
<text x="40" y="159" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">el sentido del todo?</text>
<rect x="160" y="104" width="800" height="54" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="560.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Frase del texto completo: el encierro es un corte brusco de una vida hecha afuera;</text>
<text x="560.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">el alivio llega al reencontrarse, a escondidas, con los amigos.</text>
<rect x="164.0" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="226.66666666666669" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">La vida de</text>
<text x="226.66666666666669" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">antes, afuera</text>
<rect x="297.33333333333337" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="360.00000000000006" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">El corte</text>
<text x="360.00000000000006" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">de marzo 2020</text>
<rect x="430.6666666666667" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="493.33333333333337" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">Salir a</text>
<text x="493.33333333333337" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">escondidas</text>
<rect x="564.0" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="626.6666666666666" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">Media hora</text>
<text x="626.6666666666666" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">que libera</text>
<rect x="697.3333333333334" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="760.0" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">El</text>
<text x="760.0" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">reencuentro</text>
<rect x="830.6666666666667" y="172" width="125.33333333333334" height="62" rx="10" fill="#E3EAF4" stroke="#1F3A5F" stroke-width="2"/>
<text x="893.3333333333334" y="198.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">El valor</text>
<text x="893.3333333333334" y="216.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1C2329" text-anchor="middle">del recuerdo</text>
<path d="M160,164 L160,168 L960,168 L960,164" fill="none" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="560.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">una frase por incidente: describe, no explica</text>
<text x="40" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1C2329" text-anchor="start">El texto</text>
<text x="40" y="318" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">entrevista,</text>
<text x="40" y="335" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">108 líneas</text>
<rect x="162.0" y="276" width="129.33333333333334" height="56" rx="6" fill="#E2F2F1" stroke="#1F7A78" stroke-width="2"/>
