<text x="560.0" y="724" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="middle" font-style="italic">unidades de significado: fragmentos que expresan un solo significado</text>
<rect x="40" y="764" width="920" height="96" rx="10" fill="#F2F4F3" stroke="#56626B" stroke-width="2"/>
<text x="500.0" y="797.4" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#56626B" text-anchor="middle">Un tema no es una categoría</text>
<text x="500.0" y="821.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">Formular un tema es «un acto libre de “ver”» un significado (Van Manen, 2003, pp. 96–98).</text>
<text x="500.0" y="841.4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1C2329" text-anchor="middle">La categoría clasifica fragmentos y se cuenta; el tema muestra cómo se vive algo.</text>
