<text x="626.6666666666666" y="415.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">«liberar eso tan negativo que</text>
<text x="626.6666666666666" y="432.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">trajo la pandemia» (L. 61–62)</text>
<rect x="859.3333333333334" y="324" width="68" height="5" rx="2" fill="#E0B400"/>
<polyline points="893.3333333333334,336 893.3333333333334,386" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/>
<rect x="740" y="388" width="220" height="64" rx="10" fill="#E6F2E6" stroke="#2E7D32" stroke-width="2"/>
<text x="850.0" y="415.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">«compartí con personas que</text>
<text x="850.0" y="432.6" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1C2329" text-anchor="middle">realmente me importan» (L. 100)</text>
<rect x="160" y="470" width="330" height="32" rx="16.0" fill="#F2F4F3" stroke="#56626B" stroke-width="1.6"/>
<text x="325.0" y="491.04" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#56626B" text-anchor="middle">Se descartan: fechas, lugares, horarios</text>
<text x="510" y="492" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start" font-style="italic">informan, pero no revelan la vivencia</text>
<text x="40" y="556" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6B4C8A" text-anchor="start">3 · Detallada</text>
<text x="40" y="578" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">¿Qué se vive</text>
<text x="40" y="595" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">en cada frase?</text>
<text x="40" y="612" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#56626B" text-anchor="start">→ Sección 5</text>
